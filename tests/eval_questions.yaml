  # ------------------------------------------------------ time-relative (T*)
  # These depend on when the eval is run. `verified_answer` records the date it
  # was checked; re-verify against the calendar rather than trusting it blindly.
  - id: T1
    question: "what is the present sem name?"
    expected_source_id: academic_calendar
    expected_doc: "https://www.iitk.ac.in/doaa/data/Calendar-2026.pdf"
    verified_answer: >-
      As of 22 August 2026: the 2026-27-I semester. Classes commenced July 30,
      2026 and end November 13, 2026, so today falls inside it. TIME-DEPENDENT —
      after Nov 13, 2026 the correct answer changes.
    expected_answer_contains: ["2026-27-I"]

  - id: T2
    question: "When does the current semester end?"
    expected_source_id: academic_calendar
    expected_doc: "https://www.iitk.ac.in/doaa/data/Calendar-2026.pdf"
    verified_answer: >-
      As of 22 August 2026: November 13, 2026 (Friday), the end of classes for
      2026-27-I. TIME-DEPENDENT.
    expected_answer_contains: ["Nov", "13"]

