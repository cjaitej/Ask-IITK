  - id: F2
    question: "Who holds the Poonam & Prabhu Goel Chair Professorship in CSE at IIT Kanpur?"
    expected_source_id: cse_faculty
    expected_doc: "https://www.cse.iitk.ac.in/pages/Faculty.html"
    verified_answer: >-
      Amey Karkare, a Professor in CSE, office RM-401, working on Compilers,
      Program Analysis & Code Optimization, Functional Programming, and
      Programming Languages and Education.
    expected_answer_contains: ["Karkare"]

  - id: F3
    question: "Which CSE faculty members work on cryptography?"
    expected_source_id: cse_faculty
    expected_doc: "https://www.cse.iitk.ac.in/pages/Faculty.html"
    verified_answer: >-
      Adithya Vadapalli (Applied Cryptography, Private Information Retrieval,
      Secure Multiparty Computation, Zero-Knowledge Proofs, Oblivious RAMs) and
      Angshuman Karmakar (Post Quantum Cryptography, Side-Channel attacks,
      Computation on encrypted data, Cryptology).
    expected_answer_contains: ["Vadapalli", "Karmakar"]

  - id: F4
    question: "What is Sunil Simon's designation and what does he work on?"
    expected_source_id: cse_faculty
    expected_doc: "https://www.cse.iitk.ac.in/pages/Faculty.html"
    verified_answer: >-
      Associate Professor, working on Game Theory, Distributed Systems, and
      Temporal Logics and Verification.
    expected_answer_contains: ["Associate Professor", "Game Theory"]

  - id: F5
    question: "How are the email addresses of CSE faculty at IIT Kanpur formed?"
    expected_source_id: cse_faculty
    expected_doc: "https://www.cse.iitk.ac.in/pages/Faculty.html"
    verified_answer: >-
      The email id is the faculty member's username at cse.iitk.ac.in — the
      username is listed in brackets next to each name.
    expected_answer_contains: ["cse.iitk.ac.in"]

