  # ---------------------------------- course detail pages (added later)
  # These exercise exact course-code lookup: 182 course pages are structurally
  # near-identical, so similarity search alone cannot tell CS345 from CS346.
  - id: Y1
    question: "What are the pre-requisites for CS345?"
    expected_source_id: cse_courses
    expected_doc: "https://www.cse.iitk.ac.in/pages/CS345.html"
    verified_answer: "ESC101 and CS210. CS345 is Algorithms II, Units 3-0-0-9."
    expected_answer_contains: ["ESC101", "CS210"]

  - id: Y2
    question: "What is CS345 about?"
    expected_source_id: cse_courses
    expected_doc: "https://www.cse.iitk.ac.in/pages/CS345.html"
    verified_answer: >-
      Algorithms II — amortized analysis, advanced data structures, the greedy /
      divide-and-conquer / dynamic-programming paradigms revisited with
      theoretical foundations, graph algorithms, pattern matching, max flow,
      and NP-completeness.
    expected_answer_contains: ["Algorithms II"]

  - id: Y3
    question: "How many units is CS340?"
    expected_source_id: cse_courses
    expected_doc: "https://www.cse.iitk.ac.in/pages/CS340.html"
    verified_answer: "9 units (3-0-0-9). CS340 is Theory of Computation."
    expected_answer_contains: ["9"]

  - id: Y4
    question: "What topics are covered in CS771?"
    expected_source_id: cse_courses
    expected_doc: "https://www.cse.iitk.ac.in/pages/CS771.html"
    verified_answer: >-
      Introduction to Machine Learning — mathematical foundations (multivariate
      calculus, linear algebra, probability), supervised and unsupervised
      learning, and related topics.
    expected_answer_contains: ["Machine Learning"]
